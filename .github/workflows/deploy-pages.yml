# Publica el frontend en GitHub Pages en modo demo (la API se simula en el navegador).
# Requisito único: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartkitchen-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: smartkitchen-frontend/package-lock.json

      - run: npm ci

      # La app vive en https://<usuario>.github.io/<repo>/, así que el base href es el nombre del repo.
      - name: Build (demo)
        run: npm run build -- --configuration demo --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages no conoce las rutas de Angular: 404.html = index.html permite recargar cualquier URL.
      - name: SPA fallback
        run: cp dist/smartkitchen-frontend/browser/index.html dist/smartkitchen-frontend/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: smartkitchen-frontend/dist/smartkitchen-frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
