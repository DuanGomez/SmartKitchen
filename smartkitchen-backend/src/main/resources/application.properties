# Server
server.port=${PORT:8080}

# Database (PostgreSQL). Configura tus credenciales con variables de entorno:
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/asados_pos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Data inicial manejada por DataInitializer.java (data.sql no se ejecuta con PostgreSQL)
spring.jpa.defer-datasource-initialization=true

# JWT (en producción usa una clave propia de al menos 256 bits)
jwt.secret=${JWT_SECRET:smartkitchen-dev-secret-cambia-esto-en-produccion-256-bits-minimo}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Upload de imágenes
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:uploads/productos}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
